<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electrotechnics N5 | First Principles Lab</title><style>
:root{--navy:#17263d;--blue:#005596;--gold:#ffbf32;--green:#187a46;--red:#b72e42;--paper:#f4f7fb;--line:#d9e2ed}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px/1.65 system-ui,Segoe UI,sans-serif;color:#263449}header{background:var(--navy);color:white;position:sticky;top:0;z-index:5;padding:12px max(18px,calc((100vw - 1250px)/2))}header strong{font-size:19px}header em{color:var(--gold);font-style:normal}.progress{height:5px;background:#45546a;border-radius:6px;margin-top:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--gold);width:0;transition:.3s}.shell{display:grid;grid-template-columns:255px minmax(0,1fr);gap:26px;max-width:1300px;margin:auto;padding:24px 18px 70px}aside{position:sticky;top:91px;align-self:start;max-height:calc(100vh - 115px);overflow:auto;background:white;border:1px solid var(--line);border-radius:14px;padding:14px}aside button{width:100%;text-align:left;margin:2px 0;background:transparent;color:#33455c;font-size:13px;padding:9px 10px}aside button.active{background:#eaf2ff;color:var(--blue);font-weight:800}aside button.done:after{content:' ✓';color:var(--green)}main{min-width:0}.hero{border-radius:18px;background:linear-gradient(125deg,#14365b,#006a9c);color:white;padding:32px;margin-bottom:22px}.hero h1{font-size:clamp(26px,4vw,42px);line-height:1.15;margin:10px 0}.hero p{max-width:730px}.pill{display:inline-block;background:var(--gold);color:#17263d;border-radius:20px;padding:3px 12px;font-weight:800;font-size:12px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:23px;margin:17px 0;box-shadow:0 2px 7px #15304a09}h2{color:var(--blue);line-height:1.3;margin:0 0 12px}h3{color:#174568;margin:20px 0 5px}p{margin:9px 0}button{font:inherit;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:#e8eef6;color:#1c3755}button:hover{filter:brightness(.97)}button.primary{background:var(--blue);color:white}button.gold{background:var(--gold);color:#17263d;font-weight:800}button:disabled{opacity:.55;cursor:default}.note{background:#f0f6fd;border-left:5px solid var(--blue);padding:12px 16px;border-radius:8px;margin:13px 0}.analogy{background:#fff6dc;border-left:5px solid var(--gold);padding:12px 16px;border-radius:8px;margin:13px 0}.worked{background:#eaf8ef;border-left:5px solid var(--green);padding:15px;border-radius:8px;margin:15px 0}.task{border:2px solid #3c9a64}.task h2{color:var(--green)}.q{padding:15px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.opts button{text-align:left;border:1px solid #cbd8e6;background:#f9fbfe}.opts button.sel{background:#dceafd;border-color:var(--blue);font-weight:700}.opts button.correct{background:#def3e4;border-color:var(--green)}.opts button.wrong{background:#fbe5e9;border-color:var(--red)}.feedback{margin-top:9px;font-weight:600}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0}.small{font-size:13px;color:#617184}.diagram{display:flex;justify-content:center;overflow:auto;padding:15px;background:#f7faff;border-radius:12px}.diagram svg{max-width:100%;height:auto}.challenge{border:2px dashed #bd6c24}.teach{border-left:6px solid #7355bd}.mission{background:#fff8e7;padding:14px;border-radius:10px}.step{display:inline-block;background:#e8f1ff;color:#005596;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;margin-right:7px}.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);padding:15px;border-radius:12px;text-align:center}.stat b{font-size:25px;display:block;color:var(--blue)}.hidden{display:none}.end{background:linear-gradient(120deg,#fff,#fff5d8);border:2px solid var(--gold);text-align:center}.end strong{font-size:42px;color:var(--blue)}@media(max-width:850px){.shell{display:block}aside{position:static;max-height:220px;margin-bottom:16px}.opts{grid-template-columns:1fr}.overview{grid-template-columns:1fr 1fr}.hero{padding:23px}}@media print{header,aside,.toolbar,.opts button{display:none!important}.shell{display:block}.card{break-inside:avoid}body{background:white}}

const lessons=[{"title": "Electrical quantities & the circuit story", "tag": "Foundation", "goal": "Explain current, voltage, resistance and the role of a closed circuit.", "notes": [["The water-pipe analogy", "Voltage (V) is the electrical push, current (I) is the rate of charge flow, and resistance (R) opposes that flow. A battery provides potential difference; a closed conductive path allows current to flow."], ["What is actually moving?", "Electric current is the rate at which charge passes a point: I = Q/t. One ampere means one coulomb per second. Conventional current is shown from positive to negative outside a DC source; electrons drift in the opposite direction."], ["Read a circuit before calculating", "Identify the source, load, conductors and control device. An open switch interrupts the path. Never assume an open circuit has current just because a voltage source is connected."]], "example": ["A charge of 30 C passes in 6 s.", "I = Q ÷ t = 30 ÷ 6 = 5 A."], "questions": [{"t": "Which quantity describes electrical push?", "opts": ["Resistance", "Voltage", "Current", "Energy"], "a": 1, "why": "Voltage is potential difference, measured in volts."}, {"t": "24 C passes a point in 8 s. What is the current?", "opts": ["3 A", "192 A", "0.33 A", "16 A"], "a": 0, "why": "I = 24/8 = 3 A."}, {"t": "What happens to current when an ideal switch is open?", "opts": ["It doubles", "It remains unchanged", "It becomes zero", "It reverses"], "a": 2, "why": "An open path stops current in that branch."}], "mission": "Draw a battery, switch and lamp in one loop. Label the source, load and direction of conventional current.", "tip": "Ask learners to predict whether the lamp lights before closing a real low-voltage demonstration switch."}, {"title": "Ohm’s law & resistance", "tag": "Foundation", "goal": "Use V = IR and reason about changes in a resistive circuit.", "notes": [["Ohm’s law", "For an ohmic resistor at constant temperature, voltage is proportional to current: V = IR. Rearrange to I = V/R and R = V/I."], ["Units and conversion", "Voltage: V; current: A; resistance: Ω. Convert milliamps to amps (1000 mA = 1 A) and kilo-ohms to ohms (1 kΩ = 1000 Ω) before substituting."], ["A common trap", "Ohm’s law is not a rule that every device has constant resistance. A filament lamp heats up and its resistance changes."]], "example": ["A 12 Ω resistor is connected across 48 V.", "I = V/R = 48/12 = 4 A."], "questions": [{"t": "A 6 Ω resistor carries 2 A. Find the voltage.", "opts": ["3 V", "8 V", "12 V", "24 V"], "a": 2, "why": "V = IR = 2 × 6 = 12 V."}, {"t": "0.25 A flows at 10 V. Find R.", "opts": ["2.5 Ω", "40 Ω", "10.25 Ω", "0.025 Ω"], "a": 1, "why": "R = 10/0.25 = 40 Ω."}, {"t": "For fixed resistance, doubling V will…", "opts": ["halve I", "double I", "make I zero", "quadruple R"], "a": 1, "why": "I = V/R, so current doubles."}], "mission": "Explain why a 2 kΩ resistor must be entered as 2000 Ω when using SI units.", "tip": "Use a predict–calculate–explain cycle, not memorisation of a formula triangle alone."}, {"title": "Series and parallel networks", "tag": "Circuit analysis", "goal": "Calculate equivalent resistance and identify what is shared in each connection.", "notes": [["Series", "There is one path, so the same current flows through each resistor. Resistances add: Rₜ = R₁ + R₂ + … . Source voltage is shared among the components."], ["Parallel", "Branches share the same voltage. Branch currents add at a junction. 1/Rₜ = 1/R₁ + 1/R₂ + … . For two resistors, Rₜ = R₁R₂/(R₁+R₂)."], ["Sanity checks", "A series equivalent must be greater than any individual positive resistor; a parallel equivalent must be smaller than the smallest branch resistance."]], "example": ["6 Ω and 3 Ω in parallel.", "Rₜ = (6 × 3)/(6 + 3) = 18/9 = 2 Ω."], "questions": [{"t": "4 Ω and 8 Ω in series give…", "opts": ["2.67 Ω", "12 Ω", "4 Ω", "32 Ω"], "a": 1, "why": "Series resistances add: 4 + 8 = 12 Ω."}, {"t": "In parallel, which quantity is the same across each branch?", "opts": ["Current", "Power", "Voltage", "Resistance"], "a": 2, "why": "Every branch connects to the same two nodes."}, {"t": "Two 10 Ω resistors in parallel have Rₜ = …", "opts": ["20 Ω", "10 Ω", "5 Ω", "100 Ω"], "a": 2, "why": "10×10/(10+10) = 5 Ω."}], "mission": "Sketch two circuits using the same two resistors: one series, one parallel. Explain the different paths.", "tip": "Ask students to test each answer against the sanity checks before marking it."}, {"title": "Kirchhoff’s laws & voltage division", "tag": "Circuit analysis", "goal": "Apply junction and loop laws to simple DC circuits.", "notes": [["Kirchhoff’s current law (KCL)", "At a junction, total current entering equals total current leaving. This follows conservation of charge."], ["Kirchhoff’s voltage law (KVL)", "Around a closed loop, voltage rises and drops add algebraically to zero. This follows conservation of energy."], ["Voltage divider", "For series resistors, voltage across R₂ is V₂ = Vₛ × R₂/(R₁+R₂). This assumes the output is not significantly loaded."]], "example": ["A 12 V source feeds 2 Ω and 4 Ω in series.", "Rₜ = 6 Ω; I = 12/6 = 2 A; drops: 4 V and 8 V; 4 + 8 = 12 V."], "questions": [{"t": "5 A enters a junction; 2 A leaves one branch. What leaves the other?", "opts": ["7 A", "3 A", "10 A", "2.5 A"], "a": 1, "why": "KCL: 5 = 2 + 3."}, {"t": "A 10 V supply has a 4 V drop. Remaining drop?", "opts": ["14 V", "2.5 V", "6 V", "40 V"], "a": 2, "why": "KVL: 10 = 4 + 6."}, {"t": "A 9 V supply across 1 Ω and 2 Ω in series: voltage across 2 Ω?", "opts": ["3 V", "6 V", "9 V", "18 V"], "a": 1, "why": "9 × 2/3 = 6 V."}], "mission": "Write a junction equation and a loop equation for a simple circuit you draw.", "tip": "Use coloured arrows on the board to distinguish current directions from voltage polarities."}, {"title": "Electrical power, energy & efficiency", "tag": "Power", "goal": "Distinguish instantaneous power, energy and efficiency.", "notes": [["Power", "Electrical power is the rate of energy transfer: P = VI. For a resistor, P = I²R = V²/R. Unit: watt (W)."], ["Energy", "Energy = power × time. 1 kWh = 1000 W used for 1 hour = 3.6 MJ. Electricity bills commonly use kWh, not kW."], ["Efficiency", "Efficiency η = useful output power/input power × 100%. Losses include heating, friction and magnetic losses."]], "example": ["A 2 kW heater runs for 3 hours.", "Energy = 2 kW × 3 h = 6 kWh."], "questions": [{"t": "230 V × 2 A equals…", "opts": ["115 W", "460 W", "232 W", "46 W"], "a": 1, "why": "P = VI = 230 × 2 = 460 W."}, {"t": "A 500 W appliance runs for 4 h. Energy?", "opts": ["2000 kWh", "0.125 kWh", "2 kWh", "504 kWh"], "a": 2, "why": "0.5 kW × 4 h = 2 kWh."}, {"t": "Input 800 W, useful output 600 W. Efficiency?", "opts": ["25%", "75%", "133%", "80%"], "a": 1, "why": "600/800 × 100 = 75%."}], "mission": "Estimate the energy of three everyday appliances for a one-hour operating period.", "tip": "Have learners state the unit with every numerical answer."}, {"title": "Magnetism & electromagnetic induction", "tag": "Machines", "goal": "Describe magnetic flux and Faraday’s and Lenz’s laws.", "notes": [["Magnetic quantities", "Magnetic flux Φ is measured in webers (Wb). Flux density B = Φ/A in teslas (T), for uniform flux perpendicular to area."], ["Induced emf", "A changing magnetic flux linkage induces an emf: e = −N(dΦ/dt). The magnitude depends on turns and rate of flux change."], ["Lenz’s law", "The induced effect opposes the change that produced it. The negative sign in Faraday’s law represents this opposition, not a negative magnitude in every calculation."]], "example": ["100 turns experience a flux change of 0.02 Wb in 0.5 s.", "Average induced emf magnitude = NΔΦ/Δt = 100 × 0.02/0.5 = 4 V."], "questions": [{"t": "Unit of magnetic flux?", "opts": ["Tesla", "Weber", "Henry", "Farad"], "a": 1, "why": "Flux is measured in webers; flux density in teslas."}, {"t": "What produces an induced emf in a coil?", "opts": ["Constant flux", "Changing flux linkage", "Zero turns", "Open circuit only"], "a": 1, "why": "Faraday’s law relates emf to rate of change of flux linkage."}, {"t": "200 turns, ΔΦ = 0.01 Wb over 1 s. Average emf magnitude?", "opts": ["0.02 V", "20 V", "2 V", "200 V"], "a": 2, "why": "200 × 0.01 / 1 = 2 V."}], "mission": "Explain why a magnet moved through a coil can produce a voltage even without a battery.", "tip": "Move a diagrammatic magnet toward and away from a coil; ask learners to predict reversal."}, {"title": "Alternating current & waveforms", "tag": "AC theory", "goal": "Interpret frequency, period, peak and RMS values.", "notes": [["AC waveform", "Sinusoidal voltage varies with time: v(t) = Vₘ sin(ωt), where ω = 2πf. Frequency f is cycles per second (Hz); period T = 1/f."], ["Peak versus RMS", "For a pure sine wave, Vᵣₘₛ = Vₘ/√2 and Iᵣₘₛ = Iₘ/√2. RMS represents the equivalent heating effect of DC."], ["Phase angle", "Two sine waves may reach their peaks at different times. Phase difference is measured in degrees or radians and is important in AC circuits."]], "example": ["A sine-wave voltage has a peak of 325 V.", "Vᵣₘₛ = 325/√2 ≈ 230 V."], "questions": [{"t": "At 50 Hz, one cycle takes…", "opts": ["0.02 s", "50 s", "2 s", "0.5 s"], "a": 0, "why": "T = 1/50 = 0.02 s."}, {"t": "For a sinusoid, RMS is…", "opts": ["peak × √2", "peak/√2", "peak × 2", "always zero"], "a": 1, "why": "Divide the peak by √2."}, {"t": "Angular frequency at 50 Hz is approximately…", "opts": ["50 rad/s", "100π rad/s", "25π rad/s", "2π rad/s"], "a": 1, "why": "ω = 2πf = 100π rad/s."}], "mission": "Draw a sine wave with positive peak, negative peak and one complete period labelled.", "tip": "Use a waveform sketch before introducing the equations."}, {"title": "Capacitors, inductors & reactance", "tag": "AC theory", "goal": "Explain how inductors and capacitors oppose changing AC.", "notes": [["Inductive reactance", "Xₗ = 2πfL, measured in ohms. It increases as frequency increases. In an ideal inductor, current lags voltage by 90°."], ["Capacitive reactance", "X꜀ = 1/(2πfC). It decreases as frequency increases. In an ideal capacitor, current leads voltage by 90°."], ["Frequency matters", "A DC steady state has f = 0: ideal inductive reactance is zero and ideal capacitive reactance tends to infinity. Real components also have resistance and limitations."]], "example": ["A 0.1 H inductor at 50 Hz.", "Xₗ = 2π × 50 × 0.1 ≈ 31.4 Ω."], "questions": [{"t": "If frequency doubles, inductive reactance…", "opts": ["halves", "doubles", "stays fixed", "becomes negative"], "a": 1, "why": "Xₗ is proportional to f."}, {"t": "If frequency doubles, capacitive reactance…", "opts": ["doubles", "quadruples", "halves", "stays fixed"], "a": 2, "why": "X꜀ is inversely proportional to f."}, {"t": "Which unit is used for inductance?", "opts": ["Farad", "Henry", "Weber", "Watt"], "a": 1, "why": "Inductance is measured in henries (H)."}], "mission": "Compare the effect of increasing frequency on an inductor and a capacitor in a two-column table.", "tip": "Avoid teaching lead/lag as a chant only; connect it to the energy stored in electric or magnetic fields."}, {"title": "RLC circuits, impedance & resonance", "tag": "AC theory", "goal": "Calculate impedance and understand resonance in series RLC circuits.", "notes": [["Impedance", "AC opposition includes resistance and reactance. For a series RLC circuit, Z = √[R² + (Xₗ − X꜀)²]. Current magnitude is I = Vᵣₘₛ/Z."], ["Phase relationship", "tan φ = (Xₗ − X꜀)/R. If Xₗ > X꜀, the circuit is net inductive; if X꜀ > Xₗ, net capacitive."], ["Resonance", "Series resonance occurs when Xₗ = X꜀, so reactive terms cancel and Z = R (minimum impedance). Resonant frequency f₀ = 1/(2π√LC)."]], "example": ["R = 6 Ω, Xₗ = 8 Ω, X꜀ = 0 Ω.", "Z = √(6² + 8²) = √100 = 10 Ω."], "questions": [{"t": "R=3 Ω and net reactance=4 Ω. Find Z.", "opts": ["1 Ω", "5 Ω", "7 Ω", "12 Ω"], "a": 1, "why": "Pythagoras: √(9+16) = 5 Ω."}, {"t": "At series resonance, Xₗ − X꜀ = …", "opts": ["R", "1", "0", "infinity"], "a": 2, "why": "Inductive and capacitive reactances cancel."}, {"t": "If Xₗ > X꜀, circuit behaviour is…", "opts": ["net inductive", "net capacitive", "purely resistive", "DC only"], "a": 0, "why": "Positive net reactance is inductive."}], "mission": "Explain how you would recognise resonance from a graph of current versus frequency.", "tip": "Invite learners to compare two plausible solutions and justify which one is physically sensible."}, {"title": "Power factor & AC power triangle", "tag": "AC power", "goal": "Calculate real, reactive and apparent power and interpret power factor.", "notes": [["Three kinds of power", "Real power P = VI cosφ in watts; reactive power Q = VI sinφ in var; apparent power S = VI in VA (single-phase RMS values)."], ["Power triangle", "S² = P² + Q² and power factor PF = P/S = cosφ. PF is between 0 and 1 in magnitude for conventional sinusoidal loads."], ["Why improve power factor?", "Low power factor means more current for the same real power at fixed voltage, increasing losses and equipment loading. Capacitor banks can compensate inductive loads when properly designed."]], "example": ["A load uses 800 W at 1000 VA.", "PF = P/S = 800/1000 = 0.8."], "questions": [{"t": "P=600 W and S=750 VA. Power factor?", "opts": ["1.25", "0.8", "0.2", "150"], "a": 1, "why": "600/750 = 0.8."}, {"t": "Unit of reactive power?", "opts": ["W", "VA", "var", "kWh"], "a": 2, "why": "Reactive power is measured in volt-amperes reactive (var)."}, {"t": "A purely resistive sinusoidal load has PF…", "opts": ["0", "0.5", "1", "−1 always"], "a": 2, "why": "Voltage and current are in phase, so cos 0 = 1."}], "mission": "Sketch a power triangle and label P, Q, S and the angle φ.", "tip": "Connect the triangle to real meter readings and clarify that VA is not the same as W."}, {"title": "Single-phase transformers", "tag": "Machines", "goal": "Explain transformer operation and calculate ideal voltage and current ratios.", "notes": [["How transformers work", "AC in the primary creates changing magnetic flux in the core, inducing emf in the secondary. A transformer transfers energy by electromagnetic induction."], ["Turns ratio", "For an ideal transformer Vₚ/Vₛ = Nₚ/Nₛ. Current ratio is inverse: Iₚ/Iₛ = Nₛ/Nₚ. Power is approximately conserved in an ideal transformer."], ["Real losses", "Copper losses, hysteresis and eddy currents reduce efficiency. Transformers need an alternating flux; steady DC does not provide normal transformer action."]], "example": ["Primary 1000 turns, secondary 200 turns, input 230 V.", "Vₛ = 230 × 200/1000 = 46 V."], "questions": [{"t": "A transformer with fewer secondary turns is…", "opts": ["step-up", "step-down", "a rectifier", "a capacitor"], "a": 1, "why": "Fewer turns means lower ideal secondary voltage."}, {"t": "Np=500, Ns=100, Vp=200 V. Vs?", "opts": ["1000 V", "40 V", "200 V", "20 V"], "a": 1, "why": "200 × 100/500 = 40 V."}, {"t": "Which is a common transformer loss?", "opts": ["Friction in rotor", "Copper winding heating", "Fuel combustion", "Air resistance on blades"], "a": 1, "why": "Winding resistance causes I²R losses."}], "mission": "Draw primary winding, core and secondary winding, and label a step-down example.", "tip": "Have learners predict voltage before using the turns-ratio equation."}, {"title": "Three-phase systems & connections", "tag": "Power systems", "goal": "Differentiate star and delta and calculate balanced three-phase power.", "notes": [["Why three-phase?", "Three sinusoidal phase voltages are separated by 120 electrical degrees. Balanced three-phase systems can deliver nearly constant total power."], ["Star (Y)", "For balanced star: Vₗ = √3 Vₚ and Iₗ = Iₚ. A neutral may be available."], ["Delta (Δ)", "For balanced delta: Vₗ = Vₚ and Iₗ = √3 Iₚ. Three-phase real power is P = √3 Vₗ Iₗ cosφ for a balanced load."]], "example": ["Balanced load: Vₗ=400 V, Iₗ=10 A, PF=0.8.", "P = √3 × 400 × 10 × 0.8 ≈ 5.54 kW."], "questions": [{"t": "In balanced star, line voltage equals…", "opts": ["phase voltage", "√3 × phase voltage", "phase voltage/3", "3 × phase current"], "a": 1, "why": "Vₗ = √3 Vₚ."}, {"t": "In balanced delta, line voltage is…", "opts": ["equal to phase voltage", "√3 times phase voltage", "zero", "three times phase voltage"], "a": 0, "why": "Vₗ = Vₚ."}, {"t": "Phase separation in a symmetrical three-phase supply?", "opts": ["90°", "180°", "120°", "60°"], "a": 2, "why": "The three phases are separated by 120°."}], "mission": "Make a comparison chart of Y and Δ showing line and phase relationships.", "tip": "Let students classify which equations apply before plugging in values."}, {"title": "DC motors, generators & induction motors", "tag": "Machines", "goal": "Identify the basic operating principles of common electrical machines.", "notes": [["Motor versus generator", "A motor converts electrical to mechanical energy; a generator converts mechanical to electrical energy. Both involve electromagnetic effects."], ["DC machines", "DC motors develop torque when current-carrying conductors interact with a magnetic field. Back emf increases with speed and opposes the applied voltage."], ["Induction motor", "A three-phase stator produces a rotating magnetic field. The rotor turns slightly below synchronous speed in motor operation; this difference is called slip. nₛ = 120f/P (rpm), with P poles."]], "example": ["A 4-pole induction motor operates on 50 Hz.", "nₛ = 120 × 50 / 4 = 1500 rpm."], "questions": [{"t": "A motor mainly converts…", "opts": ["mechanical to electrical", "electrical to mechanical", "heat to light", "chemical to nuclear"], "a": 1, "why": "Motors produce mechanical output from electrical input."}, {"t": "Synchronous speed of a 2-pole machine at 50 Hz?", "opts": ["750 rpm", "1500 rpm", "3000 rpm", "6000 rpm"], "a": 2, "why": "120×50/2 = 3000 rpm."}, {"t": "In motor operation, induction motor rotor speed is generally…", "opts": ["above synchronous", "equal to synchronous", "below synchronous", "always zero"], "a": 2, "why": "Slip is needed to induce rotor currents and develop torque."}], "mission": "Explain slip using a rotating-field race analogy, then calculate nₛ for a six-pole machine.", "tip": "Use the rotating magnetic field as a visual before introducing slip equations."}, {"title": "Measurement, protection & fault finding", "tag": "Practical skills", "goal": "Choose suitable instruments and reason safely about common faults.", "notes": [["Meters", "A voltmeter is connected across the measured component; an ammeter is placed in series in the measured branch. A multimeter must be configured for the correct measurement and range."], ["Protection", "Fuses and circuit breakers interrupt excessive current. Earthing and residual-current protection serve different safety functions; neither replaces safe isolation."], ["Safe troubleshooting", "For real equipment, isolate power, follow approved lockout procedures and verify absence of voltage using appropriate rated instruments and trained supervision. This tutorial uses calculations and diagrams, not live mains experiments."]], "example": ["A 12 V source is connected to a 4 Ω resistor.", "Expected current = 12/4 = 3 A. Predict readings before interpreting an idealised meter diagram."], "questions": [{"t": "Where is a voltmeter connected?", "opts": ["In series", "In parallel", "Across the mains with bare wires", "Only to earth"], "a": 1, "why": "Voltage is measured between two points, across a component."}, {"t": "Main function of a fuse?", "opts": ["Increase voltage", "Store energy", "Interrupt excessive current", "Improve power factor"], "a": 2, "why": "A fuse opens a circuit when current exceeds its designed limit."}, {"t": "Best first step before examining an electrical fault on real equipment?", "opts": ["Touch terminals", "Bypass protection", "Follow safe isolation procedure", "Increase supply voltage"], "a": 2, "why": "Safe isolation is essential before inspection."}], "mission": "Create a paper-only fault tree for let idx=0,answers={},checked={},completed={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function diagram(i){if(i===0||i===1||i===2||i===3||i===4)return `<div class="diagram"><svg viewBox="0 0 700 190" width="650" role="img" aria-label="Illustration of a simple electrical circuit"><g fill="none" stroke="#174568" stroke-width="4"><path d="M110 42H290 M370 42H560V143H110V42"/><path d="M290 42l70 -20"/><path d="M320 143h28m9 0h28"/><rect x="510" y="73" width="100" height="46" rx="5" fill="#fff3ce"/></g><g fill="#174568" font-size="17" font-family="sans-serif"><text x="298" y="13">Switch</text><text x="528" y="101">R load</text><text x="314" y="178">DC source</text><text x="135" y="32">I →</text></g></svg></div>`;if(i===6||i===7||i===8)return `<div class="diagram"><svg viewBox="0 0 680 200" width="640" role="img" aria-label="Sine wave and axes"><path d="M25 100H660M40 10V190" stroke="#64748b" stroke-width="2" fill="none"/><path id="wave" d="${Array.from({length:241},(_,j)=>`${j?'L':'M'}${40+j*2.45},${100-68*Math.sin(j/240*4*Math.PI)}`).join(' ')}" fill="none" stroke="#005596" stroke-width="4"/><g font-family="sans-serif" fill="#1b3b5a" font-size="15"><text x="8" y="22">v</text><text x="645" y="122">t</text><text x="48" y="20">+Vₘ</text><text x="48" y="183">−Vₘ</text><text x="185" y="145">One cycle (T)</text></g></svg></div>`;if(i===9)return `<div class="diagram"><svg viewBox="0 0 440 230" width="430" role="img" aria-label="AC power triangle"><path d="M50 190H350V35Z" fill="#e9f3ff" stroke="#005596" stroke-width="4"/><text x="170" y="215">P (W)</text><text x="365" y="120">Q (var)</text><text x="135" y="95">S (VA)</text><text x="80" y="180">φ</text></svg></div>`;if(i===10)return `<div class="diagram"><svg viewBox="0 0 650 200" width="620" role="img" aria-label="Transformer primary and secondary windings"><g fill="none" stroke="#005596" stroke-width="4"><rect x="255" y="25" width="140" height="150" rx="12" stroke="#8094aa" stroke-width="20"/>${Array.from({length:6},(_,j)=>`<path d="M255 ${45+j*20}q-45 -10 -45 10t45 10"/>`).join('')}${Array.from({length:4},(_,j function totals(){let n=0,c=0;lessons.forEach((l,i)=>l.questions.forEach((q,j)=>{if(checked[i+'-'+j]){n++;if(answers[i+'-'+j]===q.a)c++}}));return {n,c,all:lessons.reduce((a,l)=>a+l.questions.length,0)}}
function go(i){if(i<0||i>=lessons.length)return;idx=i;render();window.scrollTo({top:0,behavior:'instant'})}
function pick(j,k){let id=idx+'-'+j;if(checked[id])return;answers[id]=k;document.querySelectorAll(`[data-q="${j}"] button`).forEach((b,z)=>b.classList.toggle('sel',z===k))}
function check(j){let id=idx+'-'+j,q=lessons[idx].questions[j];if(answers[id]===undefined){alert('Select an answer first.');return}checked[id]=true;render()}

tity doubled? Explain before using a calculator.</div></section><section class="card task"><h2>🧠 Practice lab — select, check, explain</h2><p>Answer each question. The feedback tells you <i>why</i>, not just whether you are right.</p>`;

render();
